<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHYS 1251 Final Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a mission-control console. Left rail = flight modes, main = the active console, right drawer = AI tutor. Single dark world. */
:root{
  --bg:#05080F; --panel:#0B1220; --panel2:#101A2D; --line:#1C2942; --line2:#2A3B5E;
  --ink:#E7EEFC; --mut:#8798BC; --dim:#5A6A8C;
  --acc:#4FE3FF; --acc2:#A08BFF; --ok:#3BE29E; --warn:#FFC24F; --bad:#FF5F7E;
  --fd:'Chakra Petch',ui-sans-serif,system-ui,sans-serif; --fb:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif; --fm:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--fb);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1100px 600px at 85% -10%,rgba(79,227,255,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(160,139,255,.10),transparent 60%),
  linear-gradient(rgba(79,227,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(79,227,255,.035) 1px,transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);letter-spacing:.02em;text-wrap:balance;margin:0}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* rail */
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(11,18,32,.92),rgba(5,8,15,.92));display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand .logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#05080F;font:700 14px var(--fd)}
.brand b{font:700 15px var(--fd);display:block;letter-spacing:.06em}
.brand small{color:var(--mut);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:500;border:1px solid transparent}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav a:hover{color:var(--ink);background:rgba(79,227,255,.05)}
.nav a.on{color:var(--ink);background:rgba(79,227,255,.08);border-color:rgba(79,227,255,.28);box-shadow:inset 3px 0 0 var(--acc)}
.rail .foot{margin-top:auto;font-size:12px;color:var(--dim);padding:8px;display:flex;flex-direction:column;gap:6px}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dim);margin-right:6px}
.syncdot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
main{padding:28px clamp(16px,3.2vw,44px) 90px;max-width:1180px;width:100%}
.eyebrow{font:600 11.5px var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:30px;margin-top:4px}
.pagehead p{color:var(--mut);margin:6px 0 0;max-width:62ch}
/* panels */
.card{background:linear-gradient(180deg,rgba(16,26,45,.86),rgba(11,18,32,.86));border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative}
.card.glow{border-color:rgba(79,227,255,.35);box-shadow:0 0 0 1px rgba(79,227,255,.08),0 20px 60px -30px rgba(79,227,255,.35)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.25fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.lbl{color:var(--mut);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-weight:600;font-size:14px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:linear-gradient(135deg,var(--acc),#6fb8ff);color:#04121A;border:0}
.btn.pri:hover{filter:brightness(1.1);color:#04121A}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--mut);font-size:13px;font-weight:500}
.chip:hover{color:var(--ink);border-color:var(--mut)}
.chip.on{color:#04121A;background:var(--acc);border-color:var(--acc);font-weight:600}
.chip .star{color:var(--warn)}
.chip.on .star{color:#04121A}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font:600 11.5px var(--fm);letter-spacing:.04em;border:1px solid var(--line2);color:var(--mut)}
.pill.hot{color:var(--warn);border-color:rgba(255,194,79,.4);background:rgba(255,194,79,.06)}
.pill.ok{color:var(--ok);border-color:rgba(59,226,158,.4)}
.pill.bad{color:var(--bad);border-color:rgba(255,95,126,.4)}
.pill.acc{color:var(--acc);border-color:rgba(79,227,255,.4)}
/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.count{display:flex;gap:14px;margin:14px 0 6px}
.count div{min-width:84px;padding:12px 14px;border:1px solid var(--line2);border-radius:12px;background:rgba(5,8,15,.6);text-align:center}
.count b{display:block;font:600 38px/1 var(--fm);color:var(--ink);text-shadow:0 0 22px rgba(79,227,255,.35)}
.count span{font:600 10.5px var(--fm);color:var(--mut);letter-spacing:.14em}
.intel{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.intel li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:14px}
.intel li svg{width:18px;height:18px;stroke:var(--acc);fill:none;stroke-width:1.8;margin-top:2px}
.intel b{color:var(--ink)}
.readybar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.readybar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 16px rgba(79,227,255,.5)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.tile{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(11,18,32,.7)}
.tile:hover{border-color:var(--acc);transform:translateY(-1px)}
.tile .nm{font-weight:600;font-size:14px;line-height:1.3}
.tile .meta{color:var(--mut);font-size:12px;margin-top:3px}
.ring{width:54px;height:54px}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)}
.ring text{fill:var(--ink);font:600 13px var(--fm)}
.mission li{margin:0 0 8px}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(5,8,15,.4)}
.todo input{accent-color:var(--acc);width:17px;height:17px;margin-top:2px;flex:none}
.todo.done span{color:var(--dim);text-decoration:line-through}
.todo .go{margin-left:auto;flex:none}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,194,79,.35);background:rgba(255,194,79,.06);font-size:14px}
.alert b{color:var(--warn)}
/* problem card */
.prob .ptag{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.prob .stem{font-size:16.5px;line-height:1.65;max-width:72ch}
.prob .stem b{color:var(--acc)}
.figwrap{margin:14px 0 4px;overflow-x:auto}
.fig{width:100%;max-width:400px;height:auto;display:block}
.fig.wide{max-width:600px}
.fig .solid,.fig .thin,.fig .dash,.fig .spring,.fig .ax,.fig .gr,.fig .gr2,.fig .plot,.fig .vec,.fig .vec2{fill:none}
.fig .solid{stroke:var(--mut);stroke-width:2}
.fig .surf{fill:rgba(79,227,255,.06);stroke:var(--mut);stroke-width:1.6}
.fig .thin{stroke:var(--dim);stroke-width:1.2}
.fig .dash{stroke:var(--acc);stroke-width:1.8;stroke-dasharray:6 5}
.fig .spring{stroke:var(--warn);stroke-width:2}
.fig .blk{fill:rgba(160,139,255,.22);stroke:var(--acc2);stroke-width:1.6}
.fig .ghost{fill:none;stroke:var(--acc2);stroke-dasharray:3 3}
.fig .dot{fill:var(--acc)}
.fig .vec{stroke:var(--acc);stroke-width:2.2}
.fig .vec2{stroke:var(--acc2);stroke-width:2.2}
.fig .ahd{fill:var(--acc)}
.fig .ax{stroke:var(--mut);stroke-width:1.4}
.fig .gr{stroke:var(--line2);stroke-width:1}
.fig .gr2{stroke:var(--line);stroke-width:.8}
.fig .plot{stroke:var(--acc);stroke-width:2.6;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(79,227,255,.6))}
.fig text{fill:var(--ink);font:13px var(--fb)}
.fig .tick{fill:var(--mut);font:11px var(--fm)}
.fig.mini{width:150px}
.choices{display:grid;gap:9px;margin-top:18px}
.choices.visual{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line2);background:rgba(5,8,15,.55);font-size:15px}
.choices.visual .choice{flex-direction:column;align-items:flex-start}
.choice .key{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line2);font:600 13px var(--fm);color:var(--mut)}
.choice:hover:not(:disabled){border-color:var(--acc)}
.choice.sel{border-color:var(--acc);background:rgba(79,227,255,.08)}
.choice.sel .key{background:var(--acc);color:#04121A;border-color:var(--acc)}
.choice.right{border-color:var(--ok);background:rgba(59,226,158,.09)}
.choice.right .key{background:var(--ok);color:#04121A;border-color:var(--ok)}
.choice.wrong{border-color:var(--bad);background:rgba(255,95,126,.08)}
.choice.wrong .key{background:var(--bad);color:#04121A;border-color:var(--bad)}
.choice:disabled{cursor:default}
.ctext{font-family:var(--fb)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.actions .sp{flex:1}
.kbd{font:11px var(--fm);color:var(--dim)}
.hintbox{display:grid;gap:8px;margin-top:14px}
.hint{padding:10px 14px;border-left:3px solid var(--acc2);background:rgba(160,139,255,.07);border-radius:0 10px 10px 0;font-size:14.5px}
.hint b{color:var(--acc2);font:600 11px var(--fm);letter-spacing:.1em;display:block;margin-bottom:2px}
.verdict{display:flex;align-items:center;gap:10px;font:700 18px var(--fd);margin:18px 0 10px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.sol{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.st b{font:600 11.5px var(--fm);letter-spacing:.08em;color:var(--acc);text-transform:uppercase}
.st div{margin-top:3px}
.eq{font-family:var(--fm);font-size:14px;background:rgba(5,8,15,.65);border:1px solid var(--line);padding:8px 12px;border-radius:8px;margin:5px 0;overflow-x:auto;white-space:nowrap}
.eq b{color:var(--ok)}
.hud{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);font-size:13px}
.hud b{color:var(--ink);font-family:var(--fm)}
.ctrlrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}
/* replay */
.rgroup{display:grid;gap:8px}
.ritem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(5,8,15,.45);text-align:left;width:100%}
.ritem:hover{border-color:var(--acc)}
.ritem .q{font:600 13px var(--fm);color:var(--acc);min-width:54px}
/* mock */
.navgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.navgrid button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line2);background:transparent;font:600 12.5px var(--fm);color:var(--mut)}
.navgrid button.ans{background:rgba(79,227,255,.14);color:var(--ink);border-color:rgba(79,227,255,.4)}
.navgrid button.cur{outline:2px solid var(--acc)}
.navgrid button.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.navgrid button.r{background:rgba(59,226,158,.18);border-color:var(--ok);color:var(--ink)}
.navgrid button.w{background:rgba(255,95,126,.16);border-color:var(--bad);color:var(--ink)}
.timer{font:600 26px var(--fm);letter-spacing:.04em}
.timer.low{color:var(--warn)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:170px 1fr 52px;gap:10px;align-items:center;font-size:13.5px}
.bar .tr{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(2,4,8,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:440px}
.mockgrid{grid-template-columns:1fr 280px;align-items:start}.resgrid{grid-template-columns:340px 1fr;align-items:start}
.field{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;margin-top:6px}
.field:focus{border-color:var(--acc);outline:none}
/* methods */
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:16px}
/* formulas */
.fsec{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:minmax(180px,1.1fr) 1.4fr;gap:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(5,8,15,.45);align-items:center}
.frow .f{font-family:var(--fm);font-size:14px}
.frow .w{color:var(--mut);font-size:13.5px}
/* plan */
.day{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:16px;border:1px solid var(--line);border-radius:12px;background:rgba(11,18,32,.6)}
.day.today{border-color:var(--acc);box-shadow:0 0 0 1px rgba(79,227,255,.15),0 0 40px -18px rgba(79,227,255,.6)}
.day.past{opacity:.62}
.day .dt{font:600 13px var(--fm);color:var(--mut)}
.day .dt b{display:block;font:700 22px var(--fd);color:var(--ink)}
.day h3{font-size:16px;margin-bottom:8px}
/* tutor drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line2);z-index:40;display:flex;flex-direction:column;transform:translateX(102%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.drawer.open{transform:none;visibility:visible;transition:transform .25s ease;box-shadow:-30px 0 80px rgba(0,0,0,.5)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .msgs{flex:1;overflow-y:auto;padding:16px 18px;display:grid;gap:12px;align-content:start}
.msg{padding:11px 14px;border-radius:12px;font-size:14.5px;white-space:pre-wrap}
.msg.me{background:rgba(79,227,255,.1);border:1px solid rgba(79,227,255,.25);justify-self:end;max-width:88%}
.msg.ai{background:var(--panel2);border:1px solid var(--line)}
.drawer form{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}
.drawer input{flex:1;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit}
.empty{color:var(--mut);padding:24px;text-align:center;border:1px dashed var(--line2);border-radius:12px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;top:auto;height:auto;width:100%;z-index:30;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line)}
  .brand,.rail .foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;padding:6px 4px;font-size:10px;box-shadow:none!important}
  .nav a span{white-space:nowrap}
  .hero,.g2,.g3,.mockgrid,.resgrid{grid-template-columns:1fr}
  .mgrid{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
  .day{grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 44px}
  .count b{font-size:30px}.count div{min-width:70px}
  main{padding-bottom:110px}
}
@media (max-width:560px){.nav a span{display:none}.nav a{padding:10px 6px}.nav a svg{width:22px;height:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><div class="logo">ΣF</div><div><b>PHYS 1251</b><small>Final prep console</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><div><span class="syncdot" id="syncdot"></span><span id="synctxt">Progress saved on this device</span></div><div>Built from the PHYS 1251 eLC course · Dr. Weliweriya · Fall 2026. Not an official UGA site.</div></div>
  </aside>
  <main id="view"></main>
</div>
<aside class="drawer" id="drawer" aria-label="AI tutor">
  <header><div><div class="eyebrow">AI tutor</div><b style="font-family:var(--fd)">Explain this problem</b></div><button class="btn sm ghost" id="tclose">Close</button></header>
  <div class="msgs" id="tmsgs"></div>
  <form id="tform"><input id="tinput" placeholder="Ask a follow-up question…" autocomplete="off"><button class="btn pri sm" type="submit">Send</button></form>
</aside>
<div id="modal"></div>
<script>
/* ===================== PHYS 1251 problem engine ===================== */
const G = 9.81, DEG = Math.PI / 180;
const sin = d => Math.sin(d * DEG), cos = d => Math.cos(d * DEG), tan = d => Math.tan(d * DEG);
const atand = x => Math.atan(x) / DEG;
let _rng = Math.random; const R = () => _rng();
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = (a, b, step = 1) => { const n = Math.round((b - a) / step); return +(a + step * Math.floor(R() * (n + 1))).toFixed(6); };
const pick = a => a[Math.floor(R() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fx = (fix, k, f) => (fix && fix[k] !== undefined) ? fix[k] : f();

function fmt(x, sig = 3) {
  if (!isFinite(x)) return '—';
  if (Math.abs(x) < 1e-9) return '0';
  const a = Math.abs(x);
  let s = a >= 100 ? Math.round(x).toLocaleString('en-US') : x.toPrecision(sig);
  if (s.includes('e')) s = Number(s).toString();
  return s.replace('-', '−');
}
const U = (x, u, sig) => fmt(x, sig) + (u ? '&nbsp;' + u : '');

function mc(correct, wrongs, unit = '', o = {}) {
  const sig = o.sig || 3, signed = !!o.signed, fl = o.floor || 1e-9;
  const same = (a, b) => Math.abs(a - b) <= 0.04 * Math.max(Math.abs(a), Math.abs(b), fl) || fmt(a, sig) === fmt(b, sig);
  const vals = [correct];
  for (const w of wrongs) {
    if (!isFinite(w)) continue;
    if (!signed && w <= 0) continue;
    if (vals.some(v => same(v, w))) continue;
    vals.push(w); if (vals.length === 5) break;
  }
  const mults = shuffle([0.5, 0.65, 0.8, 1.2, 1.35, 1.5, 1.75, 2, 2.5, 0.4]);
  let i = 0;
  while (vals.length < 5 && i < 60 && Math.abs(correct) > 1e-9) {
    const w = correct * mults[i % mults.length] * (i >= 10 ? 1 + (R() - 0.5) * 0.3 : 1); i++;
    if (!vals.some(v => same(v, w))) vals.push(w);
  }
  let k = 1;
  while (vals.length < 5 && k < 50) {
    const w = correct + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * (o.step || 1); k++;
    if (!signed && w <= 0) continue;
    if (!vals.some(v => same(v, w))) vals.push(w);
  }

def('g_vt', 'graphs', 'Reading a velocity–time graph', (fix = {}) => {

    step('2 · Add components', eq(`Δx = ${fmt(X)} m, &nbsp; Δy = ${fmt(Y)} m`));
  const mode = fx(fix, 'mode', () => pick(['mag', 'dir']));
  const flip = legs.map((l, i) => i === 0 ? [l[0], legAngle(l) * -1] : [l[0], legAngle(l)]);
  const Xf = flip.reduce((s, l) => s + l[0] * Math.cos(l[1] * DEG), 0), Yf = flip.reduce((s, l) => s + l[0] * Math.sin(l[1] * DEG), 0);
  if (mode === 'mag') return { stem: stem0 + ' What is the magnitude of the total displacement from the starting point?', fig: '',
    ...mc(mag, [legs.reduce((s, l) => s + l[0], 0), Math.abs(X) + Math.abs(Y), Math.hypot(Xf, Yf), Math.abs(X), Math.abs(Y)], 'm'), src: 'Midterm 1 Q7 style',
    hints: ['Sketch the legs head-to-tail on a N/E grid first.', 'Break each leg into East (x) and North (y) components. "33° SOUTH of EAST" means start at East and rotate 33° toward South, so y is negative.', 'Add all x\'s, add all y\'s, then |Δr| = √(Δx² + Δy²).'],
    sol: sol0 + step('3 · Magnitude', eq(`|Δr| = √(${fmt(X)}² + ${fmt(Y)}²) = <b>${fmt(mag)} m</b>`)) + step('Trap', `Adding the leg lengths (${legs.reduce((s, l) => s + l[0], 0)} m) gives distance traveled, not displacement.`) };
  const make = (a, n, e) => `${fmt(a, 2)}° ${n} of ${e}`;
  const correct = make(ang, ns, ew), opp = n => n === 'NORTH' ? 'SOUTH' : 'NORTH';
  const comp = `${fmt(90 - ang, 2)}° ${ew} of ${ns}`;
  const r = mcText(correct, [make(ang, opp(ns), ew), make(90 - ang, ns, ew), make(90 - ang, opp(ns), ew), make(ang, ns, ew === 'EAST' ? 'WEST' : 'EAST'), make(ang, opp(ns), ew === 'EAST' ? 'WEST' : 'EAST'), make(90 - ang, ns, ew === 'EAST' ? 'WEST' : 'EAST'), make(30, ns, ew)]);
  return { stem: stem0 + ' What is the direction of the total displacement?', fig: '', ...r, src: 'Midterm 1 Q8 style',
    hints: ['Find Δx (East) and Δy (North) first.', 'The signs of Δx and Δy tell you the quadrant: + / − means SOUTH of EAST, etc.', 'Angle from the East–West axis: θ = tan⁻¹(|Δy|/|Δx|).'],
    sol: sol0 + step('3 · Direction', eq(`θ = tan⁻¹(|${fmt(Y)}| / |${fmt(X)}|) = ${fmt(ang, 2)}°`) + `Δx ${X >= 0 ? '> 0 (East)' : '< 0 (West)'}, Δy ${Y >= 0 ? '> 0 (North)' : '< 0 (South)'} → <b>${correct}</b> (equivalently ${comp}).`) };
});
def('v_river', 'vectors', 'Relative velocity: boat in a current', (fix = {}) => {
  const vb = fx(fix, 'vb', () => rnd(2, 6, 0.1)), vc = fx(fix, 'vc', () => rnd(0.8, 3, 0.1)), w = fx(fix, 'w', () => rnd(60, 300, 10));
  const mode = fx(fix, 'mode', () => pick(['t', 'drift', 'speed'])), t = w / vb, s = Math.hypot(vb, vc);
  const stem = `A boat that moves at ${vb} m/s relative to the water points its bow straight across a ${w} m wide river. The current flows at ${vc} m/s. `;
  const hints = ['Use v(boat, shore) = v(boat, water) + v(water, shore). These are vectors.', 'The crossing time depends only on the velocity component straight across the river.', 'Drift downstream = current speed × crossing time.'];
  const sol = step('Vector sum', eq(`v_shore = (${vc} m/s downstream, ${vb} m/s across)`)) + step('Time across', eq(`t = w / v_across = ${w}/${vb} = ${fmt(t)} s`));
  if (mode === 't') return { stem: stem + 'How long does it take to cross?', ...mc(t, [w / s, w / vc, w / (vb + vc), w / (vb - vc)], 's'), hints, sol: sol + step('Answer', `<b>${fmt(t)} s</b>`), src: 'Relative motion' };
  if (mode === 'drift') return { stem: stem + 'How far downstream does it land from the point directly opposite?', ...mc(vc * t, [vc * w / s, w * vc / (vb + vc), vb * t, w], 'm'), hints, sol: sol + step('Drift', eq(`x = v_c t = ${vc} × ${fmt(t)} = <b>${fmt(vc * t)} m</b>`)), src: 'Relative motion' };
  return { stem: stem + 'What is the boat\'s speed relative to the shore?', ...mc(s, [vb + vc, Math.abs(vb - vc), vb, Math.sqrt(Math.abs(vb * vb - vc * vc))], 'm/s'), hints, sol: step('Perpendicular components', eq(`|v| = √(${vb}² + ${vc}²) = <b>${fmt(s)} m/s</b>`)), src: 'Relative motion' };
});

/* ---- 1-D kinematics / free fall ---- */
def('k_planet', 'kin1d', 'Find g on another planet', (fix = {}) => {
  const vx = fx(fix, 'vx', () => rnd(1, 4)), vy = fx(fix, 'vy', () => rnd(3, 9)), tt = fx(fix, 'tt', () => pick([2, 3]));
  const g = vy / (tt - 1);
  return { stem: `On Planet Meepzorp a student throws a ball (no air resistance). Its position is marked every 1 s, and it reaches the top of its path at t = ${tt} s. At t = 1 s the ball's velocity is v⃗ = (${vx} x̂ + ${vy} ŷ) m/s, i.e. v = (${vx}, ${vy}) m/s. What is the gravitational acceleration g on Meepzorp?`,
    ...mc(g, [vy / tt, Math.hypot(vx, vy) / (tt - 1), 2 * vy / (tt - 1), 9.81, vy], 'm/s²'), src: 'Midterm 1 Q1 style',
    hints: ['At the top of the path, the vertical velocity is zero.', `From t = 1 s to t = ${tt} s, v_y goes from ${vy} m/s to 0.`, 'Use v_y,f = v_y,i − g·Δt.'],
    sol: step('At the top', 'v_y = 0 at the highest point. Horizontal velocity is irrelevant for g.') + step('Kinematics in y', eq(`0 = ${vy} − g(${tt} − 1) → g = <b>${fmt(g)} m/s²</b>`)) };
});
def('k_roof', 'kin1d', 'Ball thrown from a roof', (fix = {}) => {
  const h = fx(fix, 'h', () => rnd(10, 60)), v0 = fx(fix, 'v0', () => rnd(5, 20)), dir = fx(fix, 'dir', () => pick(['up', 'up', 'down']));
  const vy = dir === 'up' ? v0 : -v0, mode = fx(fix, 'mode', () => pick(dir === 'up' ? ['t', 'vf', 'hmax'] : ['t', 'vf']));
  const t = (vy + Math.sqrt(vy * vy + 2 * G * h)) / G, vf = Math.sqrt(v0 * v0 + 2 * G * h), hmax = h + v0 * v0 / (2 * G);
  const stem = `A ball is thrown straight ${dir === 'up' ? 'upward' : 'downward'} at ${v0} m/s from the edge of a roof ${h} m above the ground. Ignore air resistance. `;
  const hints = ['Pick +y = up, origin at the roof. Then the ground is at Δy = −h and a = −g, no matter which way the ball was thrown.', 'Use Δy = v₀t + ½at² for time, or v_f² = v₀² + 2aΔy for speed.', 'Time: solve the quadratic and keep the positive root.'];
  if (mode === 't') return { stem: stem + 'How long until it hits the ground?', ...mc(t, [Math.sqrt(2 * h / G), v0 / G, (vy - Math.sqrt(vy * vy + 2 * G * h)) / -G, 2 * v0 / G + Math.sqrt(2 * h / G), h / v0], 's'), hints, src: 'Free fall',
    sol: step('Set up', eq(`−${h} = (${vy})t − ½(9.81)t²`)) + step('Quadratic', eq(`4.905t² − (${vy})t − ${h} = 0 → t = <b>${fmt(t)} s</b> (positive root)`)) };
  if (mode === 'vf') return { stem: stem + 'With what speed does it hit the ground?', ...mc(vf, [Math.sqrt(2 * G * h), v0 + Math.sqrt(2 * G * h), Math.sqrt(Math.abs(2 * G * h - v0 * v0)), v0 + G * Math.sqrt(2 * h / G) * 0.5], 'm/s'), hints, src: 'Free fall',
    sol: step('Time-free equation', eq(`v_f² = v₀² + 2gh = ${v0}² + 2(9.81)(${h}) → v_f = <b>${fmt(vf)} m/s</b>`)) + step('Insight', 'Thrown up or down at the same speed → same landing speed (energy says the same thing).') };
  return { stem: stem + 'What maximum height above the ground does it reach?', ...mc(hmax, [v0 * v0 / (2 * G), v0 * v0 / G + h, h + v0 * v0 / G, h + v0 / G], 'm'), hints: ['At the top, v = 0.', 'Rise above the roof: v² = v₀² − 2g·Δy.', 'Add the roof height.'], src: 'Free fall',
    sol: step('Rise above roof', eq(`0 = ${v0}² − 2(9.81)Δy → Δy = ${fmt(v0 * v0 / (2 * G))} m`)) + step('Above ground', eq(`H = ${h} + ${fmt(v0 * v0 / (2 * G))} = <b>${fmt(hmax)} m</b>`)) };
});
def('k_brake', 'kin1d', 'Stopping distance with reaction time', (fix = {}) => {
  const kmh = fx(fix, 'kmh', () => rnd(50, 110, 5)), tr = fx(fix, 'tr', () => rnd(0.6, 1.5, 0.1)), a = fx(fix, 'a', () => rnd(4, 8, 0.5)), v = kmh / 3.6;
  const d = v * tr + v * v / (2 * a);
  return { stem: `A driver moving at ${kmh} km/h sees a hazard. Her reaction time is ${tr} s, and then the car brakes at a constant ${a} m/s². What is the total stopping distance from the moment she sees the hazard?`,
    ...mc(d, [v * v / (2 * a), v * tr + v * v / a, kmh * tr + kmh * kmh / 3.6 / 3.6 / (2 * a) * 0 + v * v / (2 * a) + kmh * tr / 3.6 * 2, v * tr], 'm'), src: '1-D kinematics',
    hints: ['Convert km/h → m/s: divide by 3.6.', 'Two phases: during the reaction time the car moves at constant speed; then it decelerates.', 'Braking distance: 0 = v² − 2a·d.'],
    sol: step('Units', eq(`v = ${kmh}/3.6 = ${fmt(v)} m/s`)) + step('Reaction phase', eq(`d₁ = v·t_r = ${fmt(v)}×${tr} = ${fmt(v * tr)} m`)) + step('Braking phase', eq(`d₂ = v²/(2a) = ${fmt(v * v / (2 * a))} m`)) + step('Total', eq(`<b>${fmt(d)} m</b>`)) };
});
def('k_catch', 'kin1d', 'Police car catches a speeder', (fix = {}) => {
  const v = fx(fix, 'v', () => rnd(20, 40)), a = fx(fix, 'a', () => rnd(2, 5, 0.5)), t = 2 * v / a, mode = fx(fix, 'mode', () => pick(['t', 'x', 'v']));
  const stem = `A speeder passes a parked police car at a constant ${v} m/s. At that instant the police car starts from rest with constant acceleration ${a} m/s². `;
  const hints = ['Write x(t) for both cars from the same origin and the same t = 0.', `Speeder: x = ${v}t. Police: x = ½(${a})t².`, 'Set them equal and solve (t = 0 is the trivial root).'];
  const sol = step('Equal positions', eq(`${v}t = ½(${a})t² → t = 2v/a = ${fmt(t)} s`));
  if (mode === 't') return { stem: stem + 'How long does it take the police car to catch the speeder?', ...mc(t, [v / a, Math.sqrt(2 * v / a), 4 * v / a, v / (2 * a)], 's'), hints, sol, src: '1-D kinematics' };
  if (mode === 'x') return { stem: stem + 'How far does the police car travel before catching the speeder?', ...mc(v * t, [v * v / a, v * v / (2 * a), 0.5 * a * (v / a) ** 2, 4 * v * v / a * 2], 'm'), hints, sol: sol + step('Distance', eq(`x = ${v}×${fmt(t)} = <b>${fmt(v * t)} m</b>`)), src: '1-D kinematics' };
  return { stem: stem + 'How fast is the police car going when it catches the speeder?', ...mc(2 * v, [v, 1.5 * v, Math.sqrt(2) * v, 3 * v], 'm/s'), hints, sol: sol + step('Speed', eq(`v = at = ${a}×${fmt(t)} = <b>${fmt(2 * v)} m/s</b> (always exactly twice the speeder's)`)), src: '1-D kinematics' };
});

/* ---- Projectile motion ---- */
def('p_cliff', 'proj', 'Arrow shot from a cliff', (fix = {}) => {
  let th, R, t;
  do { th = fx(fix, 'th', () => rnd(20, 45, 5)); R = fx(fix, 'R', () => rnd(120, 260, 10)); t = fx(fix, 't', () => rnd(6, 12, 0.5)); } while (!fix.t && G * t * t / 2 - R * tan(th) < 30);
  const v0 = R / (t * cos(th)), vx = v0 * cos(th), vy = v0 * sin(th) - G * t, sp = Math.hypot(vx, vy), h = G * t * t / 2 - R * tan(th);
  const mode = fx(fix, 'mode', () => pick(['v0', 'v0', 'vf', 'h']));
  const stem = `An archer on top of a cliff shoots an arrow at ${th}° above the horizontal. It hits a target on the ground ${R} m (horizontally) from the base of the cliff, ${t} s after release. Ignore air resistance. `;
  const hints0 = ['x and y are independent. In x there is no acceleration, so Δx = v₀ cos θ · t.', 'You know the range AND the time, so the x-equation gives v₀ directly.', 'For y: v_y = v₀ sin θ − g t, and Δy = v₀ sin θ t − ½ g t².'];
  const s1 = step('x-direction (a_x = 0)', eq(`${R} = v₀ cos ${th}° × ${t} → v₀ = ${fmt(v0)} m/s`));
  if (mode === 'v0') return { stem: stem + 'What was the initial speed v₀ of the arrow?', fig: figCliff(th), ...mc(v0, [R / t, R / (t * sin(th)), Math.sqrt(R * G / sin(2 * th)), R * cos(th) / t], 'm/s'), hints: hints0, sol: s1, src: 'Midterm 1 Q9 style' };
  if (mode === 'vf') return { stem: stem + 'What is the speed of the arrow just before it hits the ground?', fig: figCliff(th), ...mc(sp, [Math.abs(vy), v0, Math.hypot(vx, v0 * sin(th) + G * t), v0 + G * t], 'm/s'), hints: [...hints0.slice(0, 2), 'Find v_x (unchanged) and v_y at impact, then combine: |v| = √(v_x² + v_y²).'], src: 'Midterm 1 Q10 style',
    sol: s1 + step('Components at impact', eq(`v_x = ${fmt(v0)} cos ${th}° = ${fmt(vx)} m/s`) + eq(`v_y = ${fmt(v0)} sin ${th}° − 9.81(${t}) = ${fmt(vy)} m/s`)) + step('Speed', eq(`|v| = √(${fmt(vx)}² + ${fmt(vy)}²) = <b>${fmt(sp)} m/s</b>`)) };
  return { stem: stem + 'How tall is the cliff?', fig: figCliff(th), ...mc(h, [G * t * t / 2, G * t * t / 2 + R * tan(th), R * tan(th), G * t * t], 'm'), hints: [...hints0.slice(0, 2), 'Origin at launch, +y up: the ground is at Δy = −h.'], src: 'Projectile motion',
    sol: s1 + step('y-direction', eq(`Δy = v₀ sin θ t − ½gt² = ${fmt(v0 * sin(th) * t)} − ${fmt(G * t * t / 2)} = ${fmt(-h)} m`) + 'So the cliff is <b>' + fmt(h) + ' m</b> tall.') };
});
def('p_horiz', 'proj', 'Horizontal launch from a height', (fix = {}) => {
  const h = fx(fix, 'h', () => rnd(5, 80)), v = fx(fix, 'v', () => rnd(4, 30)), t = Math.sqrt(2 * h / G), vy = G * t;
  const mode = fx(fix, 'mode', () => pick(['t', 'R', 'vf', 'ang']));
  const stem = `A ball rolls off a horizontal table-top ${h} m high (think: a ledge) with speed ${v} m/s. Ignore air resistance. `;
  const hints = ['Horizontal launch: v₀y = 0. Fall time depends only on height: h = ½gt².', 'Horizontal distance: x = v₀ t.', 'Impact: v_x = v₀, v_y = g t.'];
  const s = step('Fall time', eq(`t = √(2h/g) = √(2·${h}/9.81) = ${fmt(t)} s`));
  if (mode === 't') return { stem: stem + 'How long is it in the air?', ...mc(t, [h / v, Math.sqrt(h / G), 2 * h / G, Math.sqrt(2 * h / G) * 2], 's'), hints, sol: s + step('Note', 'The horizontal speed does not change the fall time.'), src: 'Projectile motion' };
  if (mode === 'R') return { stem: stem + 'How far from the base does it land?', ...mc(v * t, [v * Math.sqrt(h / G), v * 2 * h / G, h, v * v / G], 'm'), hints, sol: s + step('Range', eq(`x = ${v}×${fmt(t)} = <b>${fmt(v * t)} m</b>`)), src: 'Projectile motion' };
  if (mode === 'vf') return { stem: stem + 'What is its speed just before landing?', ...mc(Math.hypot(v, vy), [v + vy, vy, v, Math.sqrt(v * v + G * h)], 'm/s'), hints, sol: s + step('Impact', eq(`v_y = 9.81×${fmt(t)} = ${fmt(vy)} m/s; |v| = √(${v}² + ${fmt(vy)}²) = <b>${fmt(Math.hypot(v, vy))} m/s</b>`)), src: 'Projectile motion' };
  const ang = atand(vy / v);
  return { stem: stem + 'At what angle below the horizontal does it hit the ground?', ...mc(ang, [90 - ang, atand(h / (v * t)), atand(v / vy) / 2 + 10, ang / 2], '°'), hints, sol: s + step('Angle', eq(`θ = tan⁻¹(v_y/v_x) = tan⁻¹(${fmt(vy)}/${v}) = <b>${fmt(ang)}°</b> below horizontal`)), src: 'Projectile motion' };
});
def('p_ground', 'proj', 'Launch and land at the same height', (fix = {}) => {
  const v0 = fx(fix, 'v0', () => rnd(10, 35)), th = fx(fix, 'th', () => rnd(20, 70, 5)), mode = fx(fix, 'mode', () => pick(['R', 'H', 'T', 'apex']));
  const R = v0 * v0 * sin(2 * th) / G, H = (v0 * sin(th)) ** 2 / (2 * G), Tt = 2 * v0 * sin(th) / G;
  const stem = `A soccer ball is kicked from level ground at ${v0} m/s, ${th}° above the horizontal. Ignore air resistance. `;
  const hints = ['Split v₀: v₀x = v₀ cos θ, v₀y = v₀ sin θ.', 'Time to the top: v_y = 0 → t = v₀y/g. Total flight time is twice that (same launch and landing height).', 'At the apex the velocity is purely horizontal, but the acceleration is still g downward.'];
  const comps = step('Components', eq(`v₀x = ${fmt(v0 * cos(th))} m/s, v₀y = ${fmt(v0 * sin(th))} m/s`));
  if (mode === 'R') return { stem: stem + 'How far away does it land?', ...mc(R, [v0 * v0 / G, R / 2, v0 * cos(th) * Tt / 2, v0 * v0 * sin(th) / G], 'm'), hints, sol: comps + step('Range', eq(`T = 2v₀y/g = ${fmt(Tt)} s; R = v₀x·T = <b>${fmt(R)} m</b>`)), src: 'Projectile motion' };
  if (mode === 'H') return { stem: stem + 'What maximum height does it reach?', ...mc(H, [v0 * v0 / (2 * G), H * 2, (v0 * cos(th)) ** 2 / (2 * G), v0 * sin(th) * Tt], 'm'), hints, sol: comps + step('Apex', eq(`0 = v₀y² − 2gH → H = <b>${fmt(H)} m</b>`)), src: 'Projectile motion' };
  if (mode === 'T') return { stem: stem + 'How long is it in the air?', ...mc(Tt, [Tt / 2, 2 * v0 / G, 2 * v0 * cos(th) / G, v0 / G], 's'), hints, sol: comps + step('Flight time', eq(`T = 2v₀ sin θ/g = <b>${fmt(Tt)} s</b>`)), src: 'Projectile motion' };
  return { stem: stem + 'What is its speed at the very top of its path?', ...mc(v0 * cos(th), [v0 * sin(th), v0, v0 / 2, 0], 'm/s', { signed: true, floor: 1 }), hints, sol: step('At the apex', `v_y = 0, so the speed is just v_x = v₀ cos θ = <b>${fmt(v0 * cos(th))} m/s</b>. It is not zero.`), src: 'Projectile motion' };
});
def('p_wall', 'proj', 'Does it clear the wall?', (fix = {}) => {
  let v0, th, d, y;
  do { v0 = fx(fix, 'v0', () => rnd(15, 30)); th = fx(fix, 'th', () => rnd(25, 60, 5)); d = fx(fix, 'd', () => rnd(10, 40)); y = d * tan(th) - G * d * d / (2 * v0 * v0 * cos(th) ** 2); } while (!fix.d && (y < 1 || y > 25));
  const t = d / (v0 * cos(th));
  return { stem: `A ball is kicked from the ground at ${v0} m/s, ${th}° above horizontal, toward a wall ${d} m away. At what height does the ball pass the wall?`,
    ...mc(y, [d * tan(th), d * tan(th) - G * d * d / (2 * v0 * v0), v0 * sin(th) * t, y + G * t * t / 2 * 0.5], 'm'), src: 'Projectile motion',
    hints: ['Use x to find WHEN the ball reaches the wall.', `t = d/(v₀ cos θ).`, 'Plug that t into y = v₀ sin θ t − ½gt².'],
    sol: step('Time to wall', eq(`t = ${d}/(${v0} cos ${th}°) = ${fmt(t)} s`)) + step('Height then', eq(`y = ${fmt(v0 * sin(th))}(${fmt(t)}) − ½(9.81)(${fmt(t)})² = <b>${fmt(y)} m</b>`)) };
});

/* ---- Newton's laws, FBD, friction ---- */
def('n_push', 'newton', 'Pushing/pulling a box at an angle', (fix = {}) => {
  let m, F, th, mu, up, N, a;
  do { m = fx(fix, 'm', () => rnd(10, 50)); F = fx(fix, 'F', () => rnd(60, 300, 10)); th = fx(fix, 'th', () => rnd(15, 40, 5)); mu = fx(fix, 'mu', () => rnd(0.1, 0.4, 0.05)); up = fx(fix, 'up', () => pick([true, false]));
    N = m * G + (up ? -1 : 1) * F * sin(th); a = (F * cos(th) - mu * N) / m; } while (!fix.m && (a < 0.3 || N < 0));
  return { stem: `A ${m} kg box on a level floor is ${up ? 'pulled with a rope' : 'pushed'} with a force of ${F} N directed ${th}° ${up ? 'above' : 'below'} the horizontal. The coefficient of kinetic friction is ${mu}. What is the box's acceleration?`,
    ...mc(a, [(F * cos(th) - mu * m * G) / m, (F * cos(th) - mu * (m * G + (up ? 1 : -1) * F * sin(th))) / m, F / m, (F - mu * m * G) / m, F * cos(th) / m], 'm/s²'), src: "Newton's 2nd law",
    hints: ['Draw the FBD: weight, normal, friction, applied force (split into components).', `The normal force is NOT mg here. In y: N ${up ? '+' : '−'} F sin θ − mg = 0.`, 'In x: F cos θ − μₖN = ma.'],
    sol: step('y: no vertical acceleration', eq(`N = mg ${up ? '−' : '+'} F sin θ = ${fmt(m * G)} ${up ? '−' : '+'} ${fmt(F * sin(th))} = ${fmt(N)} N`)) + step('x: Newton\'s 2nd law', eq(`a = (F cos θ − μₖN)/m = (${fmt(F * cos(th))} − ${fmt(mu * N)})/${m} = <b>${fmt(a)} m/s²</b>`)) };
});
def('n_elev', 'newton', 'Apparent weight in an elevator', (fix = {}) => {
  const m = fx(fix, 'm', () => rnd(50, 95)), a = fx(fix, 'a', () => rnd(0.5, 3, 0.1)), c = fx(fix, 'c', () => pick([['moving upward and speeding up', 1], ['moving upward and slowing down', -1], ['moving downward and speeding up', -1], ['moving downward and slowing down', 1]]));
  const ay = c[1] * a, N = m * (G + ay);
  return { stem: `A ${m} kg student stands on a bathroom scale in an elevator that is ${c[0]} at a rate of ${a} m/s². What does the scale read (in newtons)?`,
    ...mc(N, [m * G, m * (G - ay), m * a, m * (G + a) + (ay > 0 ? 40 : 0), m * G + m * a * 2], 'N'), src: "Newton's 2nd law",
    hints: ['The scale reads the normal force N, not mg.', 'Find the direction of the ACCELERATION: speeding up → a along v; slowing down → a opposite v.', 'Up positive: N − mg = m·a_y.'],
    sol: step('Direction of a', `${c[0]} → acceleration is <b>${ay > 0 ? 'upward' : 'downward'}</b>.`) + step('Newton\'s 2nd law', eq(`N = m(g + a_y) = ${m}(9.81 ${ay > 0 ? '+' : '−'} ${a}) = <b>${fmt(N)} N</b>`)) };
});
def('n_static', 'newton', 'Static vs kinetic friction trap', (fix = {}) => {

def('r_slide', 'ramps', 'Box slides down a ramp, then across concrete', (fix = {}) => {

  if (mode === 'v') return { stem: stem + 'What is the box\'s speed at the bottom of the ramp?', fig: figRamp(th, { L: L + ' m' }), ...mc(v, [Math.sqrt(2 * G * h), Math.sqrt(2 * G * (sin(th) - ms * cos(th)) * L), Math.sqrt(a * L), Math.sqrt(2 * G * L * (sin(th) + mk * cos(th)))], 'm/s'), src: 'Midterm 2 Q6 style',
    hints: ['The angle isn\'t given, so get it from sin θ = height / length.', 'It\'s sliding, so use KINETIC friction: f = μₖ mg cos θ.', 'a = g(sin θ − μₖ cos θ), then v² = 2aL.'], sol: s1 + step('Answer', `<b>${fmt(v)} m/s</b>. The frictionless answer √(2gh) = ${fmt(Math.sqrt(2 * G * h))} m/s is a trap.`) };
  return { stem: stem + `After leaving the ramp, the box slides ${fmt(d * 100)} cm across a level concrete floor before stopping. What is μₖ between box and concrete?`, fig: figRamp(th, { L: L + ' m' }), ...mc(muf, [v * v / (G * d), v / (G * d), mk, Math.sqrt(2 * G * h) ** 2 / (2 * G * d)], '', { sig: 2 }), src: 'Midterm 2 Q7 style',

});

def('m_2d', 'momentum', '2-D perfectly inelastic collision', (fix = {}) => {

  const px = mA * vA, py = mB * vB, V = Math.hypot(px, py) / (mA + mB), ang = atand(py / px), mode = fx(fix, 'mode', () => pick(['V', 'ang']));
  const stem = `At an icy intersection, car A (${mA} kg) heading east at ${vA} m/s collides with car B (${mB} kg) heading north at ${vB} m/s. They lock together. `;
  const hints = ['Momentum is conserved separately in x and in y.', `x: p_x = m_A v_A; y: p_y = m_B v_B.`, 'V = √(p_x² + p_y²)/(m_A+m_B); direction tan θ = p_y/p_x.'];
  const s = step('Components', eq(`p_x = ${fmt(px)} kg·m/s, p_y = ${fmt(py)} kg·m/s`));
  if (mode === 'V') return { stem: stem + 'What is their speed just after the collision?', fig: figCars(), ...mc(V, [(px + py) / (mA + mB), Math.hypot(vA, vB), (vA + vB) / 2, Math.hypot(vA, vB) / 2], 'm/s'), hints, sol: s + step('Speed', eq(`V = √(p_x² + p_y²)/(m_A+m_B) = <b>${fmt(V)} m/s</b>`)), src: '2-D collisions' };
  return { stem: stem + 'In what direction do they move just after the collision?', fig: figCars(), ...mcText(`${fmt(ang, 2)}° NORTH of EAST`, [`${fmt(90 - ang, 2)}° NORTH of EAST`, `${fmt(atand(vB / vA), 2)}° NORTH of EAST`, `${fmt(ang, 2)}° SOUTH of EAST`, `${fmt(ang, 2)}° NORTH of WEST`, `${fmt(90 - ang, 2)}° SOUTH of EAST`, '45° NORTH of EAST', '30° NORTH of EAST', '60° NORTH of EAST']), hints, sol: s + step('Direction', eq(`θ = tan⁻¹(p_y/p_x) = <b>${fmt(ang, 2)}° N of E</b>`) + 'Using the velocities (instead of momenta) is the common mistake.'), src: '2-D collisions' };
});
def('m_2dgen', 'momentum', '2-D glancing collision', (fix = {}) => {
  let m1, m2, v, v1p, al, p2x; do { m1 = fx(fix, 'm1', () => rnd(0.1, 0.5, 0.05)); m2 = fx(fix, 'm2', () => rnd(0.1, 0.5, 0.05)); v = fx(fix, 'v', () => rnd(3, 8, 0.5)); v1p = fx(fix, 'v1p', () => +(v * rnd(0.3, 0.7, 0.05)).toFixed(2)); al = fx(fix, 'al', () => rnd(25, 60, 5)); p2x = m1 * v - m1 * v1p * cos(al); } while (!fix.m1 && p2x <= 0);
  const p2y = -m1 * v1p * sin(al), v2 = Math.hypot(p2x, p2y) / m2, b = atand(Math.abs(p2y) / p2x), mode = fx(fix, 'mode', () => pick(['v2', 'b']));
  const stem = `A ${m1} kg puck moving at ${v} m/s in the +x direction strikes a ${m2} kg puck at rest. Afterward, the first puck moves at ${v1p} m/s at ${al}° above the +x axis. `;
  const hints = ['x and y momentum are each conserved.', 'Before: p_x = m₁v, p_y = 0.', 'Puck 2 gets whatever is left: p₂x = m₁v − m₁v₁′cos α, p₂y = −m₁v₁′ sin α.'];

  if (mode === 'v2') return { stem: stem + 'What is the speed of the second puck?', ...mc(v2, [(m1 * v - m1 * v1p) / m2, p2x / m2, m1 * v / m2, Math.abs(p2y) / m2], 'm/s'), hints, sol: s + step('Speed', eq(`v₂ = √(p₂x² + p₂y²)/m₂ = <b>${fmt(v2)} m/s</b>`)), src: '2-D collisions' };
  return { stem: stem + 'At what angle below the +x axis does the second puck move?', ...mc(b, [90 - b, al, 90 - al, b / 2 + 5], '°'), hints, sol: s + step('Angle', eq(`β = tan⁻¹(|p₂y|/p₂x) = <b>${fmt(b)}°</b> below +x`)), src: '2-D collisions' };
});
def('m_ballistic', 'momentum', 'Ballistic pendulum', (fix = {}) => {
  const m = fx(fix, 'm', () => rnd(5, 30)), M = fx(fix, 'M', () => rnd(1, 5, 0.5)), v = fx(fix, 'v', () => rnd(200, 600, 10)), mk = m / 1000;

    hints: ['Two stages! Collision first (momentum), then the swing (energy).', 'Don\'t use energy across the collision: it\'s inelastic.', 'mv = (m+M)V, then ½V² = gh.'], sol: step('Collision', eq(`V = mv/(m+M) = ${fmt(V)} m/s`)) + step('Swing', eq(`h = V²/(2g) = <b>${fmt(h)} m</b>`)) };

    hints: ['Work backwards: the rise gives V just after the collision.', 'V = √(2gh).', 'Then momentum: v = (m+M)V/m.'], sol: step('Swing', eq(`V = √(2gh) = ${fmt(Math.sqrt(2 * G * hh))} m/s`)) + step('Collision', eq(`v = (m+M)V/m = <b>${fmt(vb)} m/s</b>`)) };
});
def('m_explode', 'momentum', 'Explosion from rest', (fix = {}) => {

def('m_impulse', 'momentum', 'Impulse and average force', (fix = {}) => {
  const m = fx(fix, 'm', () => rnd(0.05, 0.6, 0.01)), v = fx(fix, 'v', () => rnd(5, 30)), vp = fx(fix, 'vp', () => rnd(3, 25)), ms = fx(fix, 'ms', () => rnd(2, 30)), F = m * (v + vp) / (ms / 1000);

/* ---- Rotational kinematics ---- */
const rpm2 = r => r * 2 * Math.PI / 60;
def('q_spin', 'rot', 'Spin-up with constant α', (fix = {}) => {
  const w0r = fx(fix, 'w0', () => pick([0, 0, rnd(60, 300, 30)])), wr = fx(fix, 'w', () => rnd(600, 3000, 100)), t = fx(fix, 't', () => rnd(2, 12, 0.5));
  const w0 = rpm2(w0r), w = rpm2(wr), al = (w - w0) / t, th = (w0 + w) / 2 * t, rev = th / (2 * Math.PI), mode = fx(fix, 'mode', () => pick(['al', 'rev']));
  const stem = `A drill bit speeds up uniformly from ${w0r} rpm to ${wr} rpm in ${t} s. `;
  const hints = ['Convert rpm → rad/s: × 2π/60.', 'Rotational kinematics mirror the linear ones: ω = ω₀ + αt, Δθ = ½(ω₀+ω)t.', 'Revolutions = Δθ/(2π).'];
  const s = step('Convert', eq(`ω₀ = ${fmt(w0)} rad/s, ω = ${fmt(w)} rad/s`));
  if (mode === 'al') return { stem: stem + 'What is its angular acceleration?', fig: figWheel(), ...mc(al, [(wr - w0r) / t, (w - w0) / t / (2 * Math.PI), (w - w0) * t, (w + w0) / t], 'rad/s²'), hints, sol: s + step('α', eq(`α = (ω − ω₀)/t = <b>${fmt(al)} rad/s²</b>`)), src: 'Constant angular acceleration' };
  return { stem: stem + 'How many revolutions does it make during this time?', fig: figWheel(), ...mc(rev, [th, (wr - w0r) / 60 * t, w * t / (2 * Math.PI), rev / 2], 'rev'), hints, sol: s + step('Δθ', eq(`Δθ = ½(ω₀+ω)t = ${fmt(th)} rad`)) + step('Revolutions', eq(`${fmt(th)}/2π = <b>${fmt(rev)} rev</b>`)), src: 'Constant angular acceleration' };
});
def('q_stop', 'rot', 'Wheel slows to a stop', (fix = {}) => {
  const wr = fx(fix, 'w', () => rnd(120, 1200, 30)), N = fx(fix, 'N', () => rnd(10, 200, 5)), w = rpm2(wr), th = 2 * Math.PI * N, al = w * w / (2 * th), t = 2 * th / w, mode = fx(fix, 'mode', () => pick(['al', 't']));
  const stem = `A spinning wheel turning at ${wr} rpm slows down uniformly and stops after ${N} revolutions. `;
  const hints = ['Convert: ω₀ in rad/s and Δθ = 2πN rad.', 'No time given → use ω² = ω₀² + 2αΔθ (with ω = 0).', 'Time: Δθ = ½(ω₀ + 0)t.'];
  if (mode === 'al') return { stem: stem + 'What is the magnitude of its angular acceleration?', fig: figWheel(), ...mc(al, [w * w / (2 * N), w / th, wr * wr / (2 * th), w * w / th], 'rad/s²'), hints, sol: step('Convert', eq(`ω₀ = ${fmt(w)} rad/s, Δθ = ${fmt(th)} rad`)) + step('Time-free', eq(`0 = ω₀² + 2αΔθ → |α| = <b>${fmt(al)} rad/s²</b>`)), src: 'Constant angular acceleration' };
  return { stem: stem + 'How long does it take to stop?', fig: figWheel(), ...mc(t, [th / w, 2 * N / w, N / wr * 60, 2 * th / wr], 's'), hints, sol: step('Average ω', eq(`Δθ = ½ω₀t → t = 2Δθ/ω₀ = <b>${fmt(t)} s</b>`)), src: 'Constant angular acceleration' };
});
def('q_point', 'rot', 'Accelerations of a point on a spinning disk', (fix = {}) => {

  const hints = ['ω = αt at that moment.', 'Tangential: a_t = rα. Radial (centripetal): a_r = rω². Speed: v = rω.', 'They are perpendicular: |a| = √(a_t² + a_r²).'];

  if (mode === 'at') return { stem: stem + 'What is its tangential acceleration?', fig: figWheel(), ...mc(at, [ar, al, r * w, Math.hypot(at, ar)], 'm/s²'), hints, sol: step('Tangential', eq(`a_t = rα = <b>${fmt(at)} m/s²</b> (constant, independent of t)`)), src: 'Linear/angular relations' };

def('q_tire', 'rot', 'Rolling tire', (fix = {}) => {

    <div class="res"></div>`;
  const pickC = i => { if (st.done) return; st.sel = i; $$('.choice', el).forEach(b => b.classList.toggle('sel', +b.dataset.i === i)); $('[data-a=check]', el).disabled = false; };
  $$('.choice', el).forEach(b => b.onclick = () => pickC(+b.dataset.i));
  const hint = () => { if (st.done || st.hints >= p.hints.length) return; $('.hintbox', el).insertAdjacentHTML('beforeend', `<div class="hint"><b>HINT ${st.hints + 1}</b>${p.hints[st.hints]}</div>`); st.hints++; $('[data-a=hint] .mono', el).textContent = `${st.hints}/${p.hints.length}`; if (st.hints >= p.hints.length) $('[data-a=hint]', el).disabled = true; };
  $('[data-a=hint]', el).onclick = hint;
  const check = () => {
    if (st.done || st.sel < 0) return; st.done = true; const ok = st.sel === p.ans;
    $$('.choice', el).forEach(b => { const i = +b.dataset.i; b.disabled = true; b.classList.remove('sel'); if (i === p.ans) b.classList.add('right'); else if (i === st.sel) b.classList.add('wrong'); });
    $('.actions', el).remove();
    $('.res', el).innerHTML = `<div class="verdict ${ok ? 'ok' : 'no'}">${ok ? '✓ Correct' : '✕ Not quite'}${st.hints && ok ? '<span class="pill" style="margin-left:6px">with hints</span>' : ''}</div>

    if (tutorOK) $('[data-a=tutor]', el).onclick = () => openTutor(p, st.sel, ok);
    if (o.next) $('[data-a=next]', el).onclick = o.next;
    if (!o.norecord) record(p, ok, st.hints);
    o.onDone && o.onDone(ok, st.hints);
  };
  $('[data-a=check]', el).onclick = check;
  el._key = e => {
    const k = e.key.toLowerCase();
    if (!st.done && 'abcde'.includes(k) && k.length === 1) { const i = 'abcde'.indexOf(k); if (i < p.choices.length) pickC(i); }

        <button class="btn ghost sm" style="width:100%;justify-content:center;margin-top:8px" id="mquit">Abandon this mock</button></div>
    </div>`;
  $$('.choice').forEach(b => b.onclick = () => { MK.ans[i] = +b.dataset.k; saveMK(); vMock(); });
  $('#mprev').onclick = () => { MK.cur--; saveMK(); vMock(); };
  $('#mnext').onclick = () => { if (i < 19) { MK.cur++; saveMK(); vMock(); } else confirmSubmit(); };
  $('#mflag').onclick = () => { MK.flags[i] = MK.flags[i] ? 0 : 1; saveMK(); vMock(); };
  $$('[data-q]').forEach(b => b.onclick = () => { MK.cur = +b.dataset.q; saveMK(); vMock(); });
  $('#msubmit').onclick = confirmSubmit;
  $('#mquit').onclick = () => modal('Abandon this mock?', 'Your answers so far will be discarded and nothing is recorded.', 'Abandon', () => { MK = null; MKP = null; saveMK(); vMock(); });
  keyTarget = { _key: e => { const k = e.key.toLowerCase(); if ('abcde'.includes(k) && k.length === 1 && 'abcde'.indexOf(k) < p.choices.length) { MK.ans[i] = 'abcde'.indexOf(k); saveMK(); vMock(); } else if (k === 'arrowright' && i < 19) { MK.cur++; saveMK(); vMock(); } else if (k === 'arrowleft' && i) { MK.cur--; saveMK(); vMock(); } } };
  const tick = () => { const el = $('#timer'); if (!el) { clearInterval(mkTimer); return; } const el2 = (Date.now() - MK.start) / 1000; let s = MK.limit ? MK.limit * 60 - el2 : el2; if (MK.limit && s <= 0) { clearInterval(mkTimer); submitMock(); return; } s = Math.max(0, Math.floor(s)); el.textContent = `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; el.classList.toggle('low', MK.limit && s < 600); };
  tick(); mkTimer = setInterval(tick, 1000);
}
function modal(title, body, okTxt, onOk) {
  $('#modal').innerHTML = `<div class="modal"><div class="card glow"><h2 style="font-size:20px">${title}</h2><p style="color:var(--mut)">${body}</p><div class="actions"><button class="btn ghost" id="mx">Cancel</button><span class="sp"></span><button class="btn pri" id="mo">${okTxt}</button></div></div></div>`;
  $('#mx').onclick = () => $('#modal').innerHTML = ''; $('#mo').onclick = () => { $('#modal').innerHTML = ''; onOk(); };
}
function confirmSubmit() { const left = MK.ans.filter(a => a < 0).length; modal('Submit your mock final?', left ? `You have <b style="color:var(--warn)">${left} unanswered</b> question${left > 1 ? 's' : ''}. On the real exam, always guess: there's no penalty.` : 'All 20 answered. Ready to see your score?', 'Submit', submitMock); }
function submitMock() {
  const P = mkProbs(); MK.done = true; MK.end = Date.now(); let score = 0; const by = {};
  P.forEach((p, i) => { const ok = MK.ans[i] === p.ans; if (ok) score++; by[p.topic] = by[p.topic] || [0, 0]; by[p.topic][1]++; if (ok) by[p.topic][0]++; S.att.push({ t: p.topic, ok: ok ? 1 : 0, h: 0, ts: Date.now() }); if (!ok) S.missed.push(p.ref); });
  S.mocks.push({ score, n: 20, ts: Date.now(), limit: MK.limit, mins: Math.round((MK.end - MK.start) / 6e4), by }); save(); saveMK(); vMock();
}
function mockResults(P) {
  const m = S.mocks[S.mocks.length - 1], score = P.filter((p, i) => MK.ans[i] === p.ans).length;
  const by = {}; P.forEach((p, i) => { by[p.topic] = by[p.topic] || [0, 0]; by[p.topic][1]++; if (MK.ans[i] === p.ans) by[p.topic][0]++; });
  $('#view').innerHTML = `<div class="pagehead"><div><div class="eyebrow">Mock Final · results</div><h1>${score}/20 · ${Math.round(score / 20 * 100)}%</h1><p>${score >= 18 ? 'Exam-ready on this set. Keep it sharp with the weak-spot drill.' : score >= 14 ? 'Solid. Fix the red topics below and you\'re in A territory.' : 'This is exactly why we diagnose early. Every miss is now in your Missed queue.'} ${m && m.mins ? `Time used: ${m.mins} min.` : ''}</p></div>
    <div class="actions" style="margin:0"><button class="btn" id="mnew">New mock</button><button class="btn pri" data-go="p:missed">Redo my misses</button></div></div>
    <div class="grid resgrid">
      <div class="card"><div class="lbl" style="margin-bottom:12px">By topic</div><div class="bars">${Object.entries(by).map(([t, [a, n]]) => `<div class="bar" style="grid-template-columns:110px 1fr 40px"><span>${TOP[t].short}</span><span class="tr"><i style="width:${a / n * 100}%;background:${mcol(a / n)}"></i></span><b class="mono">${a}/${n}</b></div>`).join('')}</div>
        <div class="navgrid" style="margin-top:16px">${P.map((p, i) => `<button class="${MK.ans[i] === p.ans ? 'r' : 'w'}" data-j="${i}">${i + 1}</button>`).join('')}</div></div>
      <div id="review" class="grid" style="gap:12px"></div></div>`;
  $('#mnew').onclick = () => { MK = null; MKP = null; saveMK(); vMock(); };
  const rv = $('#review');
  P.forEach((p, i) => {
    const ok = MK.ans[i] === p.ans, el = document.createElement('details'); el.className = 'card'; el.id = 'rv' + i; if (!ok && !$('details[open]', rv)) el.open = true;
    el.innerHTML = `<summary style="cursor:pointer;display:flex;gap:10px;align-items:center"><span class="pill ${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✕'} Q${i + 1}</span><span>${esc(TOP[p.topic].short)} · ${esc(strip(p.stem).slice(0, 80))}…</span></summary>
      <div style="margin-top:12px" class="prob"><div class="stem">${p.stem}</div>${p.fig ? `<div class="figwrap">${p.fig}</div>` : ''}<div class="choices ${p.visualChoices ? 'visual' : ''}">${p.choices.map((c, k) => `<div class="choice ${k === p.ans ? 'right' : k === MK.ans[i] ? 'wrong' : ''}"><span class="key">${'ABCDE'[k]}</span><span class="ctext">${c}</span></div>`).join('')}</div>
      <div class="sol" style="margin-top:14px">${p.sol}</div>${tutorOK ? `<div class="actions"><button class="btn sm" data-tq="${i}">Ask the tutor about this one</button></div>` : ''}</div>`;
    rv.appendChild(el);
  });
  $$('[data-tq]').forEach(b => b.onclick = () => { const i = +b.dataset.tq; openTutor(P[i], MK.ans[i], MK.ans[i] === P[i].ans); });
  $$('[data-j]').forEach(b => b.onclick = () => { const d = $('#rv' + b.dataset.j); d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
}

/* ---------- METHOD PICKER ---------- */
let MQ = null;
function vMethods() {
  if (!MQ) MQ = { i: Math.floor(Math.random() * METHOD_Q.length), pick: -1 };
  const q = METHOD_Q[MQ.i];
  $('#view').innerHTML = `<div class="pagehead"><div><div class="eyebrow">Method Picker</div><h1>Which tool do you reach for?</h1><p>From his "Thinking Ahead" slide: "Take the time to evaluate each problem solving method. Which is appropriate given the information you are given?" Picking the right method in the first 20 seconds is half of each exam question.</p></div>
    <div class="hud"><span>Streak <b>${S.meth.streak}</b></span><span>Best <b>${S.meth.best}</b></span><span>All-time <b>${S.meth.ok}/${S.meth.n}</b></span></div></div>
    <article class="card glow"><div class="lbl">Scenario</div><div class="stem" style="font-size:19px;margin-top:8px;font-family:var(--fd)">${esc(q.s)}</div>
      <div class="mgrid">${METHODS.map((m, k) => `<button class="choice ${MQ.pick < 0 ? '' : k === q.a ? 'right' : k === MQ.pick ? 'wrong' : ''}" data-k="${k}" ${MQ.pick >= 0 ? 'disabled' : ''}><span class="key">${k + 1}</span><span class="ctext">${esc(m)}</span></button>`).join('')}</div>
      ${MQ.pick >= 0 ? `<div class="verdict ${MQ.pick === q.a ? 'ok' : 'no'}">${MQ.pick === q.a ? '✓ Right tool' : '✕ Better tool: ' + esc(METHODS[q.a])}</div><div class="sol"><div class="st"><b>Why</b><div>${esc(q.why)}</div></div></div><div class="actions"><span class="sp"></span><button class="btn pri" id="mqn">Next scenario →</button></div>` : '<div class="kbd" style="margin-top:12px">Press 1–6</div>'}
    </article>`;
  const choose = k => { if (MQ.pick >= 0) return; MQ.pick = k; S.meth.n++; if (k === q.a) { S.meth.ok++; S.meth.streak++; S.meth.best = Math.max(S.meth.best, S.meth.streak); } else S.meth.streak = 0; save(); vMethods(); };
  $$('[data-k]').forEach(b => b.onclick = () => choose(+b.dataset.k));
  const nxt = () => { let j; do { j = Math.floor(Math.random() * METHOD_Q.length); } while (j === MQ.i); MQ = { i: j, pick: -1 }; vMethods(); };
  if ($('#mqn')) $('#mqn').onclick = nxt;
  keyTarget = { _key: e => { if (MQ.pick < 0 && /^[1-6]$/.test(e.key)) choose(+e.key - 1); else if (MQ.pick >= 0 && e.key === 'Enter') nxt(); } };
}

/* ---------- FORMULA SHEET ---------- */
const FSHEET = [
  ['Kinematics: definitions', [['v = dr/dt, &nbsp; a = dv/dt', 'Slope of x–t is v; slope of v–t is a; area under v–t is Δx.'], ['ω = dθ/dt, &nbsp; α = dω/dt', 'The rotational twins (Day 22): every point on a rigid body shares ω and α.']]],
  ['Constant acceleration (tᵢ = 0)', [['Δr = ½(vᵢ + v_f)t', 'No acceleration given? This one doesn\'t need a.'], ['Δr = vᵢt + ½at²', 'Time known, final velocity unknown: free fall, projectile y-motion.'], ['Δv = at', 'Time to the top of a throw: 0 = v₀y − gt.'], ['v_fx² = v_ix² + 2a_x Δx', 'No time given: braking distances, ramp speed (Midterm 2 Q6), sliding to a stop.'], ['Rotational: Δθ = ωᵢt + ½αt², &nbsp; ω_f² = ωᵢ² + 2αΔθ', 'Swap x→θ, v→ω, a→α. Convert rpm → rad/s (×2π/60) and revolutions → rad (×2π).']]],
  ['Linear ↔ angular, circular motion', [['s = rθ, &nbsp; v_t = rω, &nbsp; a_t = rα', 'Points farther out move faster (bugs on the turntable).'], ['a_r = v²/r = rω² = 4π²r/T²', 'Always toward the center. In F_net = ma at the top/bottom of a circle, the "ma" is m·v²/r.'], ['T = 2πr/v = 2π/ω', 'Period: time for one revolution.']]],
  ['Relative motion', [['v_AB + v_BC = v_AC', 'Boats in currents, planes in wind. Add as vectors (components!).']]],
  ['Newton\'s laws', [['F_net = 0 ⇒ v constant', '"Constant speed" or "at rest" in a problem = net force zero (Midterm 3 Q6).'], ['F_net = ma', 'Separate FBD for each object; pick + in the direction of motion; add equations to cancel tension.'], ['F₁₂ = −F₂₁', '3rd-law pairs act on DIFFERENT objects (Midterm 2 Q2).']]],
  ['Types of forces', [['f_s ≤ μₛF_N, &nbsp; f_k = μₖF_N', 'Static is "up to". If it\'s sliding, use μₖ. N is not always mg (angled pushes, inclines, circles).'], ['F = mg, &nbsp; U = mgy', 'On an incline: mg sin θ along, mg cos θ into the surface.'], ['F = −kΔr, &nbsp; U = ½k(Δr)²', 'Force for equilibrium/constant speed; ½kx² only when the stretch changes.']]],
  ['Work & energy', [['W = F·Δr = FΔr cos θ', 'θ is between F and displacement: friction gives −, forces perpendicular to motion give 0.'], ['W_tot = ΔK', 'All forces (Midterm 3 Q3: bobsled speed).'], ['W_nc = ΔE = ΔK + ΔU', 'Extended W–E: friction doing work. Springs on rough ramps → quadratic in the compression.'], ['P = dW/dt = F·v', 'Constant-speed lifting: P = mgv.'], ['K = ½mv² = p²/2m', 'Same momentum, smaller mass → more KE → longer stopping distance (Midterm 3 Q4).']]],
  ['Momentum', [['p = mv, &nbsp; I = FΔt = Δp', 'Impulse: bouncing back makes Δv = v + v′.'], ['ΣF_ext = 0 ⇒ p_tot constant', 'Conserve x and y SEPARATELY. In 2-D: p_x before = p_x after, p_y before = p_y after.'], ['Mr_cm = Σmᵢrᵢ, &nbsp; Mv_cm = Σpᵢ', 'Center of mass of a system.']]],
  ['Rotational dynamics (on the sheet, beyond his focus list)', [['τ = rF sin φ, &nbsp; Στ = Iα', 'Lab 11 "Balancing Act": Στ = 0 for balance.'], ['K_rot = ½Iω², &nbsp; K = ½Mv_cm² + ½I_cmω²', 'Rolling without slipping: v = rω.'], ['I: rod ML²/12 (end ML²/3), hoop MR², disk MR²/2, solid sphere 2MR²/5, hollow sphere 2MR²/3', 'Given on the sheet. Don\'t memorize.']]],
];
function vFormulas() {
  $('#view').innerHTML = `<div class="pagehead"><div><div class="eyebrow">Formula Sheet</div><h1>Your final-exam formula sheet, annotated</h1><p>These are the equations on the official "Physics 1251 Final Exam Formula/Data Sheets" (g = 9.81 m/s²). You'll have the sheet in the exam, so the right column is what to learn: when to use each one.</p></div></div>
    <div class="grid" style="gap:18px">${FSHEET.map(([h, rows]) => `<section class="fsec"><div class="lbl">${esc(h)}</div>${rows.map(([f, w]) => `<div class="frow"><div class="f">${f}</div><div class="w">${w}</div></div>`).join('')}</section>`).join('')}</div>`;
}

/* ---------- PLAN ---------- */
function vPlan() {
  const t = today(), done = PLAN.reduce((a, p) => a + p.tasks.filter((x, j) => S.plan[`${p.d}:${j}`]).length, 0), all = PLAN.reduce((a, p) => a + p.tasks.length, 0);
  $('#view').innerHTML = `<div class="pagehead"><div><div class="eyebrow">Study Plan · Nov 22 → Dec 4</div><h1>13 days, one topic block at a time</h1><p>Built from his study tips: go section by section, redo slide examples and homework, then the midterms, review packets and sample tests. ★ days are his highlighted topics. Tick tasks as you go; "Open" jumps to the right place in the app.</p></div>
    <div class="hud"><span>Tasks done <b>${done}/${all}</b></span></div></div>
    <div class="grid" style="gap:12px">${PLAN.map(p => { const dt = new Date(p.d + 'T12:00:00'); return `<div class="day ${p.d === t ? 'today' : p.d < t ? 'past' : ''}"><div class="dt">${dt.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase()}<b>${dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</b>${p.d === t ? '<span class="pill acc" style="margin-top:6px">TODAY</span>' : ''}</div><div><h3>${esc(p.title)}</h3><div class="grid" style="gap:8px">${p.tasks.map((x, j) => todoHTML(p, 0, j)).join('')}</div></div></div>`; }).join('')}</div>`;
  bindTodos($('#view'));
}

/* ---------- PROFILE / BACKUP ---------- */
const SECTIONS = { '840': ['8:40 am', 'Instructional Plaza N106'], '1200': ['12:00 pm', 'Instructional Plaza N106'], '255': ['2:55 pm', 'Instructional Plaza S306'] };
function roomLine() { const x = SECTIONS[S.sec]; return x ? `<b style="color:var(--ink)">${x[1]}</b> (your ${x[0]} section)` : '8:40 & 12:00 sections → <b style="color:var(--ink)">Instructional Plaza N106</b> · 2:55 section → <b style="color:var(--ink)">S306</b>'; }
function profileModal() {
  const code = (() => { try { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (e) { return ''; } })();
  $('#modal').innerHTML = `<div class="modal"><div class="card glow" style="max-width:520px;width:100%"><div class="eyebrow">${S.setup ? 'Profile & backup' : 'Welcome'}</div><h2 style="font-size:22px;margin:4px 0 6px">${S.setup ? 'Your profile' : 'Set up your study console'}</h2>
    <p style="color:var(--mut);margin:0 0 14px;font-size:14px">Your progress is stored only for you. It never mixes with anyone else's, even when the same link is shared.</p>
    <label class="lbl" for="pname">First name (optional)</label><input id="pname" class="field" value="${esc(S.name)}" maxlength="24" placeholder="e.g. Jordan">
    <label class="lbl" for="psec" style="margin-top:12px;display:block">Your PHYS 1251 class time</label>
    <select id="psec" class="field"><option value="">Not sure / other</option>${Object.entries(SECTIONS).map(([k, [t, r]]) => `<option value="${k}" ${S.sec === k ? 'selected' : ''}>${t} (final in ${r})</option>`).join('')}</select>
    ${S.setup ? `<details style="margin-top:16px"><summary class="lbl" style="cursor:pointer">Move progress to another device</summary>
      <p style="color:var(--mut);font-size:13.5px">Copy your backup code here, then paste it on the other device under "Restore".</p>
      <div class="actions" style="margin-top:6px"><button class="btn sm" id="pcopy">Copy backup code</button><span class="kbd" id="pcopied"></span></div>
      <textarea id="pcode" class="field" rows="3" readonly style="margin-top:8px;font:11px var(--fm)">${code}</textarea>
      <label class="lbl" for="prest" style="margin-top:12px;display:block">Restore from a backup code</label><textarea id="prest" class="field" rows="2" placeholder="Paste a backup code"></textarea>
      <div class="actions"><button class="btn sm" id="pdo">Restore</button><span class="kbd" id="pmsg"></span><span class="sp"></span><button class="btn sm ghost" id="preset" style="color:var(--bad)">Reset all progress</button></div></details>` : ''}
    <div class="actions"><span class="sp"></span><button class="btn pri" id="psave">${S.setup ? 'Save' : 'Start studying'}</button></div></div></div>`;
  $('#psave').onclick = () => { S.name = $('#pname').value.trim().slice(0, 24); S.sec = $('#psec').value; S.setup = 1; save(); $('#modal').innerHTML = ''; render(); };
  if (!S.setup) return;
  $('#pcopy').onclick = async () => { const t = $('#pcode'); try { await navigator.clipboard.writeText(t.value); $('#pcopied').textContent = 'Copied.'; } catch (e) { t.select(); $('#pcopied').textContent = 'Selected: press Ctrl/⌘+C.'; } };
  $('#pdo').onclick = () => { try { const r = JSON.parse(decodeURIComponent(escape(atob($('#prest').value.trim())))); if (!r || !Array.isArray(r.att)) throw 0; S = Object.assign(blank(), r, { setup: 1 }); save(); $('#modal').innerHTML = ''; render(); } catch (e) { $('#pmsg').textContent = 'That code didn\'t work. Copy the whole thing and try again.'; } };
  $('#preset').onclick = () => { if ($('#preset').dataset.sure) { const n = S.name, sec = S.sec; S = Object.assign(blank(), { name: n, sec, setup: 1 }); save(); $('#modal').innerHTML = ''; render(); } else { $('#preset').dataset.sure = 1; $('#preset').textContent = 'Click again to erase everything'; } };
}

/* ---------- TUTOR ---------- */
let TU = { msgs: [], ctx: '', busy: false, ac: null };
function openTutor(p, sel, ok) {
  const ctx = `You are a patient, sharp physics tutor helping a UGA student (PHYS 1251, calculus-based mechanics for engineers, Dr. Weliweriya) prepare for a cumulative multiple-choice final. Use g = 9.81 m/s². Write plain text (no markdown headings, no LaTeX); use simple inline math like v^2 = 2ad. Be concise: at most about 170 words unless asked for more. Teach the reasoning: which principle applies and why, the setup, and the one idea that unlocks it. Never just restate the solution.

PROBLEM: ${strip(p.stem)}
CHOICES: ${p.choices.map((c, i) => 'ABCDE'[i] + ') ' + strip(c)).join('  ')}
CORRECT ANSWER: ${'ABCDE'[p.ans]}) ${strip(p.choices[p.ans])}
OFFICIAL WORKED SOLUTION: ${strip(p.sol)}
STUDENT CHOSE: ${sel >= 0 ? 'ABCDE'[sel] + ') ' + strip(p.choices[sel]) : '(no answer)'} — ${ok ? 'correct' : 'incorrect'}`;
  TU = { msgs: [], ctx, busy: false, ac: null };
  $('#drawer').classList.add('open'); $('#tmsgs').innerHTML = '';
  ask(ok ? 'I got this right. Explain the key idea so I can do any version of it, and tell me the trap to watch for.' : `I picked ${'ABCDE'[sel]}. What did I most likely do wrong, and how should I think about this problem?`);
}
async function ask(q) {
  if (TU.busy || !sampleFn) return; TU.busy = true;
  TU.msgs.push({ role: 'user', content: q });
  $('#tmsgs').insertAdjacentHTML('beforeend', `<div class="msg me">${esc(q)}</div><div class="msg ai" id="tcur">Thinking…</div>`);
  const cur = $('#tcur'); cur.removeAttribute('id');
  const convo = TU.msgs.map((m, i) => i === 0 ? { role: 'user', content: TU.ctx + '\n\nSTUDENT: ' + m.content } : m);
  TU.ac = new AbortController();
  try {
    const r = await sampleFn(convo, { onText: ({ text }) => { cur.textContent = text; $('#tmsgs').scrollTop = 1e9; }, signal: TU.ac.signal, cache: false });
    cur.textContent = r.text; TU.msgs.push({ role: 'assistant', content: r.text });
  } catch (e) {
    if (e && e.code === 'not_granted') { tutorOK = false; cur.textContent = 'The tutor isn\'t available here. Open this page on claude.ai to use it.'; }
    else if (e && e.code === 'rate_limited') cur.textContent = 'The tutor is busy right now. Try again in a minute.';
    else if (e && e.name !== 'AbortError') cur.textContent = 'Couldn\'t reach the tutor. Try again in a moment.';
    TU.msgs.pop();
  }
  TU.busy = false; $('#tmsgs').scrollTop = 1e9;
}
$('#tclose').onclick = () => { $('#drawer').classList.remove('open'); TU.ac && TU.ac.abort(); };
$('#tform').onsubmit = e => { e.preventDefault(); const v = $('#tinput').value.trim(); if (!v) return; $('#tinput').value = ''; ask(v); };

/* ---------- boot ---------- */
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b && !b.closest('.todo')) { e.preventDefault(); goTask(b.dataset.go); } });
render();
initCaps();
